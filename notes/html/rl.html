<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Love心动应答器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: linear-gradient(145deg, #f9eef7 0%, #ffe6f0 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Segoe UI', 'Roboto', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif; padding: 1.5rem; }
.chat-card { max-width: 680px; width: 100%; background: rgba(255, 255, 255, 0.96); border-radius: 2.5rem; box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.25), 0 8px 18px rgba(0, 0, 0, 0.05); overflow: hidden; transition: all 0.2s ease; border: 1px solid rgba(255, 215, 225, 0.6); }
.card-header { background: #ffb7c5; background: linear-gradient(135deg, #ffb7c5 0%, #ff8aa4 100%); padding: 1.2rem 2rem; color: white; text-align: center; }
.card-header h1 { font-size: 1.8rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 0.6rem; }
.card-header h1 span { font-size: 1.9rem; }
.card-header p { font-size: 0.8rem; opacity: 0.9; margin-top: 0.4rem; }
.card-content { padding: 1.8rem 2rem 2rem 2rem; }
.input-group { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1.5rem; align-items: center; }
.input-wrapper { flex: 1; min-width: 180px; }
.question-input { width: 100%; padding: 0.9rem 1.2rem; font-size: 1rem; border: 1.5px solid #ffe2e8; border-radius: 2rem; background: #fffcfd; transition: all 0.25s; font-family: inherit; outline: none; color: #3a2c31; font-weight: 500; }
.question-input:focus { border-color: #ff8aa4; box-shadow: 0 0 0 3px rgba(255, 138, 164, 0.2); }
.question-input::placeholder { color: #d9b6c0; font-weight: normal; }
.send-btn { background: #ff8aa4; border: none; padding: 0 1.8rem; height: 3.2rem; border-radius: 3rem; font-weight: 600; font-size: 1rem; color: white; display: inline-flex; align-items: center; gap: 0.5rem; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 8px rgba(255, 100, 130, 0.3); font-family: inherit; }
.send-btn:hover { background: #ff6f8e; transform: scale(0.97); box-shadow: 0 2px 5px rgba(255, 80, 110, 0.4); }
.send-btn:active { transform: scale(0.96); }
.send-btn:disabled { background: #ddb7c1; cursor: not-allowed; transform: none; box-shadow: none; opacity: 0.7; }
.loading { display: flex; justify-content: center; align-items: center; gap: 10px; padding: 1rem; background: #fff3f5; border-radius: 2rem; margin: 1rem 0; color: #ff6f8e; font-weight: 500; }
.spinner { width: 24px; height: 24px; border: 3px solid #ffe0e6; border-top: 3px solid #ff6f8e; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.output-container { margin-top: 1rem; background: #fffafb; border-radius: 1.8rem; border: 1px solid #ffebef; padding: 1.2rem 1.5rem; transition: 0.2s; }
.output-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; flex-wrap: wrap; gap: 0.5rem; }
.output-label { font-size: 0.75rem; font-weight: 600; color: #c45a74; letter-spacing: 0.5px; background: #fff0f3; padding: 0.2rem 0.8rem; border-radius: 2rem; }
.copy-btn { background: none; border: 1px solid #ffcbd6; padding: 0.3rem 1rem; border-radius: 2rem; font-size: 0.75rem; color: #c45a74; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 0.4rem; font-weight: 500; background: white; }
.copy-btn:hover { background: #ffeff2; border-color: #ff8aa4; color: #a13e58; }
.copy-btn:active { transform: scale(0.96); }
.answer-text-simple { background: #ffffff; border-radius: 1.2rem; padding: 1rem 1.2rem; font-size: 1.05rem; line-height: 1.5; color: #2c1f24; font-weight: 500; word-break: break-word; white-space: pre-wrap; border: 1px solid #ffe1e8; min-height: 100px; }
.error-text { color: #b33b4d; background: #fff0f0; }
.toast-msg { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #3a2c31cc; backdrop-filter: blur(8px); color: white; padding: 0.5rem 1.2rem; border-radius: 2rem; font-size: 0.8rem; z-index: 1000; pointer-events: none; opacity: 0; transition: opacity 0.2s ease; }
.example-tips { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; justify-content: center; }
.chip { background: #ffeef2; padding: 0.4rem 1rem; border-radius: 2rem; font-size: 0.75rem; color: #c45a74; cursor: pointer; transition: 0.1s; font-weight: 500; border: 1px solid #ffced9; }
.chip:hover { background: #ffdce4; color: #a13e58; transform: translateY(-1px); }
footer { text-align: center; font-size: 0.7rem; color: #e0a7b6; padding: 1rem 1rem 0.5rem; border-top: 1px solid #ffecf0; margin-top: 1rem; }
@media (max-width: 550px) { .card-content { padding: 1.2rem; } .send-btn { padding: 0 1.2rem; } .question-input { padding: 0.7rem 1rem; } .answer-text-simple { font-size: 0.95rem; } }
</style>
</head>
<body>
<div class="chat-card">
<div class="card-header">
<h1><span>💗</span> 心动回响 · Love </h1>
<p>✨ 智能恋爱助手 | 输入心意，收获温柔 ✨</p>
</div>
<div class="card-content">
<div class="input-group">
<div class="input-wrapper">
<input type="text" id="questionInput" class="question-input" placeholder="输入你想说的话… 例如：你在干嘛、想我了吗">
</div>
<button id="sendBtn" class="send-btn"><span>✨</span> 发送提问</button>
</div>
<div class="example-tips">
<span class="chip" data-question="你在干嘛">💬 你在干嘛</span>
<span class="chip" data-question="想我了吗">💭 想我了吗</span>
<span class="chip" data-question="今天开心吗">🌸 今天开心吗</span>
<span class="chip" data-question="我有点想你了">💖 我有点想你了</span>
</div>
<div id="loadingArea" style="display: none;">
<div class="loading">
<div class="spinner"></div>
<span>小精灵正在传递情话...</span>
</div>
</div>
<div class="output-container" id="outputContainer">
<div class="output-header">
<span class="output-label">✨ 智能回复</span>
<button id="copyResultBtn" class="copy-btn" disabled>📋 复制文字</button>
</div>
<div id="resultTextArea" class="answer-text-simple"></div>
</div>
<footer>🌸 基于 智能 | 点击复制按钮可一键复制回复内容</footer>
</div>
</div>
<div id="toastMessage" class="toast-msg">✨ 已复制到剪贴板</div>

<script>
(function() {
    const API_BASE_URL = 'https://api.magicalbox.cn/api9/love/';  // 设置API地址
    const questionInput = document.getElementById('questionInput');
    const sendBtn = document.getElementById('sendBtn');
    const loadingArea = document.getElementById('loadingArea');
    const resultTextArea = document.getElementById('resultTextArea');
    const copyBtn = document.getElementById('copyResultBtn');
    const toastEl = document.getElementById('toastMessage');
    let currentReplyText = '';
    
    function showToast(msg, duration = 1500) {
        toastEl.textContent = msg || '📋 已复制';
        toastEl.style.opacity = '1';
        setTimeout(() => { toastEl.style.opacity = '0'; }, duration);
    }
    
    function setCopyButtonEnabled(enabled) {
        if (enabled && currentReplyText && currentReplyText.trim().length > 0) {
            copyBtn.disabled = false;
            copyBtn.style.opacity = '1';
            copyBtn.style.cursor = 'pointer';
        } else {
            copyBtn.disabled = true;
            copyBtn.style.opacity = '0.6';
            copyBtn.style.cursor = 'not-allowed';
        }
    }
    
    function updateDisplayText(text, isError = false) {
        resultTextArea.textContent = text;
        if (isError) {
            resultTextArea.classList.add('error-text');
        } else {
            resultTextArea.classList.remove('error-text');
        }
        currentReplyText = text;
        setCopyButtonEnabled(true);
    }
    
    function showLoading(show) {
        if (show) {
            loadingArea.style.display = 'block';
            sendBtn.disabled = true;
            copyBtn.disabled = true;
            resultTextArea.textContent = '';
            currentReplyText = '';
        } else {
            loadingArea.style.display = 'none';
            sendBtn.disabled = false;
            setCopyButtonEnabled(!!(currentReplyText && currentReplyText.trim()));
        }
    }
    
    async function callLoveAPI(question) {
        if (!question || question.trim() === '') {
            throw new Error('💖 问题不能为空，请输入你想说的话～');
        }
        
        const encodedQuestion = encodeURIComponent(question.trim());
        const requestUrl = `${API_BASE_URL}?question=${encodedQuestion}`;
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 15000);
        
        try {
            const response = await fetch(requestUrl, {
                method: 'GET',
                headers: { 'Accept': 'application/json, text/plain, */*' },
                signal: controller.signal,
                mode: 'cors',
            });
            clearTimeout(timeoutId);
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            
            const data = await response.json();
            return data;
            
        } catch (err) {
            clearTimeout(timeoutId);
            if (err.name === 'AbortError') {
                throw new Error('⏱️ 请求超时，请稍后再试');
            } else if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
                throw new Error('🌐 网络请求失败，可能是跨域限制或API不可达。\n建议：更换网络环境或使用现代浏览器。');
            } else {
                throw err;
            }
        }
    }
    
    async function handleSend() {
        const question = questionInput.value.trim();
        if (!question) {
            showToast('💬 输入框不能为空', 1200);
            return;
        }
        
        showLoading(true);
        
        try {
            const apiResult = await callLoveAPI(question);
            
            // 根据API返回的数据结构，直接提取answer字段
            if (apiResult && apiResult.answer) {
                updateDisplayText(apiResult.answer, false);
            } else if (apiResult && apiResult.msg) {
                updateDisplayText(apiResult.msg, false);
            } else {
                updateDisplayText('💫 API返回了空内容，请重试一次', false);
            }
            
        } catch (error) {
            console.error('API调用出错:', error);
            let errMsg = typeof error === 'string' ? error : (error.message || '未知错误');
            updateDisplayText(`⚠️ 获取失败：${errMsg}`, true);
        } finally {
            showLoading(false);
        }
    }
    
    async function copyCurrentText() {
        if (!currentReplyText || currentReplyText.trim() === '') {
            showToast('📭 没有可复制的内容', 1000);
            return;
        }
        try {
            await navigator.clipboard.writeText(currentReplyText);
            showToast('✅ 已复制到剪贴板', 1500);
        } catch (err) {
            const textarea = document.createElement('textarea');
            textarea.value = currentReplyText;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast('📋 已复制 (兼容模式)', 1500);
        }
    }
    
    sendBtn.addEventListener('click', handleSend);
    questionInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); handleSend(); }
    });
    copyBtn.addEventListener('click', copyCurrentText);
    
    const chips = document.querySelectorAll('.chip');
    chips.forEach(chip => {
        chip.addEventListener('click', (e) => {
            const preQuestion = chip.getAttribute('data-question');
            if (preQuestion) {
                questionInput.value = preQuestion;
                handleSend();
            }
        });
    });
    
    resultTextArea.textContent = '';
    currentReplyText = '';
    setCopyButtonEnabled(false);
    questionInput.value = '';
})();
</script>

</body>
</html>
