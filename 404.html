<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>404 · 页面未找到 | GitHub 云笔记</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    :root {
      /* 背景图取色：柔米白，可自行更换成背景图中的颜色 */
      --text-color: #f0e6d2;
      /* 字体：先用楷体模拟书法感，识别出图中字体后替换 */
      --font-style: "KaiTi", "STKaiti", "楷体", "华文楷体", "Ma Shan Zheng", cursive;
    }

    body {
      font-family: var(--font-style);
      color: var(--text-color);
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #111;
      position: relative;
      overflow-x: hidden;
    }

    /* 动态背景层：缓慢缩放，保持图片完整、不模糊 */
    .bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image: url("https://commimg.pddpic.com/upload/common/network_clear/a543bc5c-e411-493e-bfd1-fa8d5c24abfd.jpg?imageView2/2/w/1125/q/80");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      z-index: 0;
      animation: kenburns 25s ease-in-out infinite alternate;
    }
    @keyframes kenburns {
      0%   { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    /* 底部渐变遮罩：只压暗下边缘，不动背景主体 */
    .bottom-bar {
      position: relative;
      z-index: 1;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 24px 20px 30px;
      text-align: center;
      background: linear-gradient(to top, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.25) 55%, transparent 100%);
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 1.2s ease-out forwards;
      animation-delay: 0.3s;
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .code {
      font-size: 72px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 4px;
      color: var(--text-color);
      text-shadow: 0 2px 12px rgba(0,0,0,0.6);
      animation: glow 2.5s ease-in-out infinite;
    }
    @keyframes glow {
      0%, 100% { text-shadow: 0 2px 12px rgba(0,0,0,0.6); }
      50%      { text-shadow: 0 2px 20px rgba(240,230,210,0.45); }
    }

    .msg {
      margin-top: 10px;
      font-size: 17px;
      line-height: 1.7;
      letter-spacing: 1px;
      color: var(--text-color);
      text-shadow: 0 1px 8px rgba(0,0,0,0.75);
    }
  </style>
</head>
<body>
  <!-- 动态背景层 -->
  <div class="bg" aria-hidden="true"></div>

  <!-- 底部文字区域 -->
  <div class="bottom-bar">
    <div class="code">404</div>
    <div class="msg">⚠️ 你访问的地址不存在或者未部署，如果是刚上传的，请等 2 分钟后再访问。</div>
  </div>
</body>
</html>
